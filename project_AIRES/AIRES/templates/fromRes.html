<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Application Submitted</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css"
      integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    />
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        font-family:
          "Segoe UI",
          system-ui,
          -apple-system,
          sans-serif;
        /* background: var(--dash-bg); */
        background-image: radial-gradient(hsl(213, 76%, 20%), hsl(213, 75%, 10%), hsl(210, 56%, 5%), hsl(207, 58%, 2%), hsl(0, 0%, 0%));
        /* color: var(--aire-text); */
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      }

      .container {
        text-align: center;
        padding: 20px;
      }

      .icon-container {
        margin-bottom: 24px;
      }

      .check-icon {
        width: 64px;
        height: 64px;
        fill: var(--aire-teal-dim);
      }

      h1 {
        font-size: 38px;
        font-weight: 700;
        margin: 0 0 16px 0;
        color: var(--aire-teal-dim);
        letter-spacing: -0.5px;
      }

      .message-primary {
        font-size: 18px;
        font-weight: 600;
        margin: 0 0 12px 0;
        color: #fff;
      }

      .ambiguity-alert {
        background: rgba(249, 115, 22, 0.08);
        border: 1px solid rgba(249, 115, 22, 0.2);
        border-left: 3px solid var(--aire-orange);
        border-radius: var(--aire-radius-sm);
        padding: 10px 14px;
        margin-bottom: 12px;
        font-size: 13px;
        color: #fed7aa;
        line-height: 1.55;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="icon-container">
        <svg class="check-icon" viewBox="0 0 24 24">
          <path d="M9 16.17L4.83 12l-1.42 1.41L9 19 21 7l-1.41-1.41z" stroke="#4e9a44" stroke-width="1.5" fill="#4e9a44" />
        </svg>
      </div>
      <h1 style="color: aqua">Thank You!</h1>
      <p class="message-primary">Your application was successfully submitted.</p>
      <p class="ambiguity-alert">We'll contact you</p>
    </div>
  </body>
</html>
