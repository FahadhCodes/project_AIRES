<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIRE — Chatbot Response</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <link rel="stylesheet" href="AIRE_project\AIRE\static\css\style.css" />
    <style>
      /* ── Design tokens ─────────────────────────────────────────────────────── */

      :root {
        --ink: #161a1d;
        --paper: #f6f4ef;
        --line: #d8d3c6;
        --accent: #3a6b5c; /* muted signal green — "system understood" */
        --accent-soft: #e3ece8;
        --warn: #b0703a; /* queued / low confidence */
        --warn-soft: #f3e8dd;
        --greeting: #ffb3003c;
        --ink: #161a1d;
        --aire-bg: #0d1b2a;
        --aire-surface: #132233;
        --aire-card: #1a2e42;
        --aire-card-hover: #1f3650;
        --aire-teal: #0d9488;
        --aire-teal-lt: #14b8a6;
        --aire-teal-dim: rgba(13, 148, 136, 0.15);
        --aire-orange: #f97316;
        --aire-orange-dim: rgba(249, 115, 22, 0.12);
        --aire-purple: #7c3aed;
        --aire-purple-dim: rgba(124, 58, 237, 0.12);
        --aire-text: #e2f0f9;
        --aire-text-muted: #7a99b0;
        --aire-border: rgba(255, 255, 255, 0.07);
        --aire-radius: 12px;
        --aire-radius-sm: 8px;
        --aire-shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
        --mono: "SF Mono", "JetBrains Mono", "Courier New", monospace;
        --sans: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      /* ── Base reset (minimal) ──────────────────────────────────────────────── */
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      body {
        margin: 0;
        background: var(--paper);
        font-family: var(--sans);
        color: var(--ink);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
      }

      /* ── Message bubble (the actual container) ────────────────────────────── */
      .msg-bubble {
        max-width: 88%;
        border-radius: var(--aire-radius);
        padding: 12px 16px;
        position: relative;
        line-height: 1.65;
      }

      .msg-bubble.bubble-aire {
        background: var(--aire-card);
        border: 1px solid var(--aire-border);
        border-top-left-radius: 4px;
      }

      /* ── Badge row ──────────────────────────────────────────────────────────── */
      .badge-row {
        display: flex;
        gap: 8px;
        flex-wrap: wrap;
        margin-bottom: 10px;
      }

      .aire-badge {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        padding: 3px 10px;
        border-radius: 20px;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.3px;
      }

      .badge-domain {
        background: rgba(3, 105, 161, 0.2);
        border: 1px solid rgba(3, 105, 161, 0.4);
        color: #38bdf8;
      }

      .badge-ambiguity-count {
        background: var(--aire-orange-dim);
        border: 1px solid rgba(249, 115, 22, 0.3);
        color: var(--aire-orange);
      }

      .badge-type {
        background: var(--aire-purple-dim);
        border: 1px solid rgba(124, 58, 237, 0.3);
        color: #a78bfa;
      }

      /* ── Ambiguity alert banner ────────────────────────────────────────────── */
      .ambiguity-alert {
        background: rgba(249, 115, 22, 0.08);
        border: 1px solid rgba(249, 115, 22, 0.2);
        border-left: 3px solid var(--aire-orange);
        border-radius: var(--aire-radius-sm);
        padding: 10px 14px;
        margin-bottom: 12px;
        font-size: 13px;
        color: #fed7aa;
        line-height: 1.55;
      }

      /* ── Requirement sentence block ────────────────────────────────────────── */
      .req-block {
        background: rgba(255, 255, 255, 0.03);
        border: 1px solid var(--aire-border);
        border-radius: var(--aire-radius-sm);
        padding: 10px 14px;
        margin-bottom: 16px;
      }

      .req-block-sentence {
        font-size: 13px;
        color: #cbd5e1;
        font-style: italic;
        border-left: 2px solid var(--aire-teal);
        padding-left: 10px;
        margin-bottom: 8px;
        line-height: 1.55;
      }

      .req-block-meta {
        display: flex;
        gap: 6px;
        flex-wrap: wrap;
        align-items: center;
      }

      .req-type-pill {
        font-size: 10px;
        font-weight: 700;
        padding: 2px 8px;
        border-radius: 20px;
        letter-spacing: 0.4px;
      }

      .pill-functional {
        background: rgba(16, 185, 129, 0.15);
        color: #34d399;
        border: 1px solid rgba(16, 185, 129, 0.3);
      }

      .pill-performance {
        background: rgba(59, 130, 246, 0.12);
        color: #93c5fd;
        border: 1px solid rgba(59, 130, 246, 0.25);
      }

      .confidence-chip {
        font-size: 10px;
        color: var(--aire-text-muted);
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--aire-border);
        padding: 2px 7px;
        border-radius: 20px;
      }

      /* ── Progress bar ──────────────────────────────────────────────────────── */
      .clarification-progress-label {
        font-size: 10px;
        color: var(--aire-text-muted);
        margin-bottom: 6px;
        display: flex;
        justify-content: space-between;
      }

      .clarification-progress {
        background: rgba(255, 255, 255, 0.05);
        border-radius: 20px;
        height: 4px;
        margin-bottom: 12px;
        overflow: hidden;
      }

      .clarification-progress-fill {
        height: 100%;
        background: linear-gradient(90deg, var(--aire-teal), var(--aire-teal-lt));
        border-radius: 20px;
        width: 0%;
        transition: width 0.5s ease;
      }

      /* ── Ambiguity section headings ────────────────────────────────────────── */
      .ambiguity-section {
        margin-top: 4px;
      }

      .ambiguity-section-title {
        font-size: 11px;
        font-weight: 700;
        text-transform: uppercase;
        letter-spacing: 0.8px;
        color: var(--aire-text-muted);
        margin-bottom: 10px;
        padding-bottom: 6px;
        border-bottom: 1px solid var(--aire-border);
      }

      /* ── Ambiguity cards ───────────────────────────────────────────────────── */
      .ambiguity-card {
        background: var(--aire-card);
        border: 1px solid var(--aire-border);
        border-radius: var(--aire-radius);
        margin-bottom: 14px;
        overflow: hidden;
        transition: border-color 0.2s;
      }

      .ambiguity-card:hover {
        border-color: rgba(13, 148, 136, 0.3);
      }

      .ambiguity-card-header {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 14px;
        border-bottom: 1px solid var(--aire-border);
      }

      .ambiguity-type-icon {
        width: 28px;
        height: 28px;
        border-radius: 6px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 13px;
        flex-shrink: 0;
      }

      .icon-semantic {
        background: rgba(124, 58, 237, 0.2);
      }

      .icon-scope {
        border: 1.5px solid #ffcf00;
      }

      .ambiguity-type-label {
        font-size: 12px;
        font-weight: 700;
        color: var(--aire-text);
      }

      .ambiguity-type-desc {
        font-size: 11px;
        color: var(--aire-text-muted);
        margin-top: 1px;
      }

      .ambiguity-card-body {
        padding: 12px 14px;
      }

      /* ── Questions ─────────────────────────────────────────────────────────── */
      .question-item {
        display: flex;
        align-items: flex-start;
        gap: 10px;
        margin-bottom: 14px;
      }

      .question-item:last-child {
        margin-bottom: 0;
      }

      .question-number {
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--aire-teal-dim);
        border: 1px solid rgba(13, 148, 136, 0.3);
        color: var(--aire-teal-lt);
        font-size: 10px;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        margin-top: 2px;
      }

      .question-content {
        flex: 1;
      }

      .question-text {
        font-size: 13px;
        color: var(--aire-text);
        margin-bottom: 6px;
        line-height: 1.5;
      }

      /* ── Answer textarea ───────────────────────────────────────────────────── */
      .answer-field-wrap {
        position: relative;
      }

      .answer-field {
        width: 100%;
        background: rgba(255, 255, 255, 0.04);
        border: 1px solid var(--aire-border);
        border-radius: var(--aire-radius-sm);
        color: var(--aire-text);
        font-size: 12px;
        padding: 8px 40px 8px 10px;
        resize: none;
        outline: none;
        transition:
          border-color 0.2s,
          background 0.2s;
        font-family: inherit;
        line-height: 1.5;
        min-height: 38px;
      }

      .answer-field::placeholder {
        color: var(--aire-text-muted);
        font-size: 11px;
      }

      .answer-field:focus {
        border-color: var(--aire-teal);
        background: rgba(13, 148, 136, 0.06);
      }

      .answer-send-btn {
        position: absolute;
        right: 6px;
        bottom: 6px;
        width: 26px;
        height: 26px;
        border-radius: 6px;
        background: var(--aire-teal);
        border: none;
        color: #fff;
        font-size: 11px;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: background 0.2s;
        flex-shrink: 0;
      }

      .answer-send-btn:hover {
        background: var(--aire-teal-lt);
      }

      /* ── Submit buttons ────────────────────────────────────────────────────── */
      .submit-all-row {
        display: flex;
        justify-content: flex-end;
        margin-top: 16px;
        gap: 8px;
      }

      .btn-aire-primary {
        background: var(--aire-teal);
        border: none;
        color: #fff;
        font-size: 12px;
        font-weight: 600;
        padding: 8px 18px;
        border-radius: 8px;
        cursor: pointer;
        transition:
          background 0.2s,
          transform 0.1s;
        display: flex;
        align-items: center;
        gap: 6px;
      }

      .btn-aire-primary:hover {
        background: var(--aire-teal-lt);
        transform: translateY(-1px);
      }

      .btn-aire-ghost {
        background: transparent;
        border: 1px solid var(--aire-border);
        color: var(--aire-text-muted);
        font-size: 12px;
        padding: 8px 18px;
        border-radius: 8px;
        cursor: pointer;
        transition:
          border-color 0.2s,
          color 0.2s;
      }

      .btn-aire-ghost:hover {
        border-color: var(--aire-teal);
        color: var(--aire-teal-lt);
      }

      /* ── Typing animation (used by the .typing-dot elements, if present) ──── */
      @keyframes typing-bounce {
        0%,
        80%,
        100% {
          transform: translateY(0);
          opacity: 0.4;
        }
        40% {
          transform: translateY(-4px);
          opacity: 1;
        }
      }

      /* ── Scrollbar (kept because it affects the bubble container) ────────── */
      ::-webkit-scrollbar {
        width: 4px;
      }
      ::-webkit-scrollbar-track {
        background: transparent;
      }
      ::-webkit-scrollbar-thumb {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <main class="thread" id="thread">
      <div class="msg-row" id="bubble"></div>
    </main>
  </body>
  <script>
    function scrollToBottom() {
      thread.scrollTop = thread.scrollHeight;
    }
    async function replayText() {
      try {
        let response = await fetch("TEST.json");
        let data = await response.json();
        console.log(data);
        addBotMessage(data, "clarify", null);
      } catch (error) {
        console.log("ERROR:", error);
      }
    }
    replayText();
    function addBotMessage(data, statusClass, metaText) {
      const msg = document.createElement("div");

      let str = "";
      data.reply.DETECTED_AMBIGUITES.forEach((ambiguity) => {
        console.log(ambiguity);
        console.log(data.reply.GROUPED_BY_AMBIGUITY);
        str += `
           <div class="ambiguity-card" id="card-scope">
              <div class="ambiguity-card-header">
                <div class="ambiguity-type-icon icon-scope"><div class='p-2 border border-info rounded'></div></div>
                <div>
                  <div class="ambiguity-type-label">${ambiguity}</div>
                  <div class="ambiguity-type-desc">"${data.reply.GROUPED_BY_AMBIGUITY[ambiguity]}"</div>
                </div>
              </div>
              <div class="ambiguity-card-body">
                <div class="question-item">
                  <div class="question-number">1</div>
                  <div class="question-content">
                    <div class="question-text">What exactly should this feature include?</div>
                    <div class="answer-field-wrap d-flex">
                      <textarea
                        class="answer-field"
                        rows="1"
                        placeholder="e.g. Search by category, price filter, and wishlist..."
                        oninput="
                          autoResize(this);
                          checkProgress();
                        "
                        data-card="scope_1"
                      ></textarea>
                      <button class="answer-send-btn" title="Save answer">✓</button>
                    </div>
                  </div>
                </div>


              </div>
           </div>
          `;
      });

      msg.className = `msg msg--bot ${statusClass ? "msg--" + statusClass : ""}`;
      msg.innerHTML = `
        <div class="msg-label">AIRE</div>
        <div class="bubble"></div>
        ${metaText ? `<div class="meta-tag"></div>` : ""}
    `;
      msg.querySelector(".bubble").innerHTML = data; // Based on the status class we can inject the intractive Q&A chat-response
      if (metaText) msg.querySelector(".meta-tag").textContent = metaText;
      if (data.reply) {
        msg.className = "msg msg--bot msg--clarify";
        msg.innerHTML = `
        <div class="msg-label">AIRE</div>
        <div class="bubble msg-row" id="aireResponse">
         <div class="badge-row">
            <span class="aire-badge badge-domain">${data.reply.DOMAIN}</span>
            <span class="aire-badge badge-ambiguity-count">⚠ ${data.reply.DETECTED_AMBIGUITES.length} Ambiguities Detected</span>
          </div>

          <div class="ambiguity-alert">${data.reply.DESCRIPTION}</div>
          <div class="clarification-progress-label">
            <span>Clarification progress</span>
            <span id="progressLabel"></span>
          </div>
          <div class="clarification-progress">
            <div class="clarification-progress-fill" id="progressFill"></div>
          </div>

           <!-- ── Ambiguity cards ─────────────────────────────────────────── -->
          <div class="ambiguity-section">
            <div class="ambiguity-section-title">Clarification Required</div>
            ${str}
          </div>
        </div>
        <div class="meta-tag">meta-tag</div>
        
    `;
      }
      thread.appendChild(msg);
      scrollToBottom();
    }
    // ── Show response after typing animation ──────────────────────────────────
    setTimeout(() => {
      // document.getElementById("typingRow").style.display = "none";
      document.getElementById("aireResponse").style.display = "block";
      document.getElementById("thread").scrollTop = thread.scrollHeight;
    }, 2000);
    // ── Auto resize textarea ──────────────────────────────────────────────────
    function autoResize(el) {
      el.style.height = "auto";
      el.style.height = Math.min(el.scrollHeight, 120) + "px";
    }

    // ── Progress tracking ─────────────────────────────────────────────────────
    function checkProgress() {
      const cards = ["scope_1", "scope_2", "scope_3", "semantic_1", "semantic_2", "semantic_3"];
      let answered = 0;

      cards.forEach((card) => {
        const fields = document.querySelectorAll(`[data-card="${card}"]`);
        const hasAny = Array.from(fields).some((f) => f.value.trim().length > 0);
        if (hasAny) answered++;
      });

      const pct = Math.round((answered / cards.length) * 100);
      document.getElementById("progressFill").style.width = pct + "%";
      document.getElementById("progressLabel").textContent = `${answered} / ${cards.length} Questions answered`;
    }

    // ── Submit all clarifications ─────────────────────────────────────────────
    function submitAll() {
      document.getElementById("aireResponse").style.display = "block";
      document.getElementById("confirmRow").style.display = "block";
      document.getElementById("thread").scrollTop = thread.scrollHeight;
      const textAreas = document.querySelectorAll(".answer-field");
      textAreas.forEach((input) => {
        input.disabled = true;
      });
    }

    // ── Skip ──────────────────────────────────────────────────────────────────
    function skipAll() {
      const skipMsg = document.createElement("div");
      skipMsg.className = "msg msg--user";
      skipMsg.innerHTML = `
      <div class="msg-label">You</div>
      <div class="bubble">I'll clarify these later.</div>`;

      document.getElementById("thread").appendChild(skipMsg);
      document.getElementById("aireResponse").style.display = "none";

      const tokenMsg = document.createElement("div");
      tokenMsg.className = "msg msg--bot queued";
      tokenMsg.innerHTML = `
      <div class="msg-label">AIRE</div>
      <div class="bubble">Understood. Your requirement has been saved with token <strong>#TK-2024-0042</strong>.
          Our team will reach out to clarify the open points.</div>`;
      document.getElementById("thread").appendChild(tokenMsg);
      document.getElementById("thread").scrollTop = thread.scrollHeight;
    }
  </script>
</html>
