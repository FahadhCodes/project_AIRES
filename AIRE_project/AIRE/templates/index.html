<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AIRE</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" />
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
    <style>
      .console {
        /* background: var(--aire-bg); */
        background-image: radial-gradient(hsl(213, 76%, 20%), hsl(213, 75%, 10%), hsl(210, 58%, 5%), hsl(207, 56%, 2%), hsl(0, 0%, 0%));
        background-position-y: -50vh;
        height: 100vh;
        width: 100vw;
        border-radius: 4px;
        display: flex;
        flex-direction: column;
        overflow: hidden;
        box-shadow: 0 1px 0 rgba(0, 0, 0, 0.02);
        transition: all 0.5s;
      }
      .chatTITLE {
        /* transform: translate(-50%, -50%); */
        /* position: absolute; */
        /* margin: auto; */
        display: grid;
        /* flex-direction: column; */
        justify-content: center;
        align-content: center;
        /* border: 1px solid red; */
        height: 100%;
        font-family: var(--mono);
        transition: all 0.5s ease-in-out;
      }
      .title {
        color: var(--paper);
        font-size: 7.5vw;
        width: 80vw;
        text-align: center;
        font-weight: 500;
        letter-spacing: 0.8em;
        text-indent: 0.8em;
        /* border: 1px solid yellow; */
      }
      .subtitle {
        width: 80vw;
        text-align: center;
        /* border: 1px solid orange; */
        font-size: 1.4vw;
        color: var(--aire-teal-lt);
      }
    </style>
  </head>
  <body>
    <div class="console">
      <header class="console-header">
        <div class="header-left">
          <span class="logo">AIRES</span>
          <span class="header-sub">Requirement Intake Console</span>
        </div>
        <div class="header-right">
          <span class="status-dot"></span>
          <span class="status-text">listening</span>
        </div>
      </header>

      <main class="thread" id="thread">
        <div class="chatTITLE">
          <h1 class="title">AIRES</h1>
          <h4 class="subtitle">Artificial Intelligence Requirement Elisitation System</h4>
        </div>
        <!-- <div class="msg msg--bot">
          <div class="msg-label">AIRE</div>
          <div class="bubble">
            Describe a requirement for your system and I'll log it. If I'm confident I understood it, I'll ask one quick follow-up. Otherwise I'll
            queue it for the team.
          </div>
        </div> -->
      </main>

      <form class="composer m-1 p-2 rounded-pill" id="composer" autocomplete="off">
        <input type="text" id="messageInput" placeholder="e.g. The system should let admins reset a user's password" autocomplete="off" />
        <button type="submit" id="sendBtn" aria-label="Send">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none">
            <path d="M3 11L21 3L13 21L11 13L3 11Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round" />
          </svg>
        </button>
      </form>
    </div>
    <script>
      const consoleEl = document.querySelector(".console");

      const startS = [5, 5, 5, 5];
      const endS = [76, 75, 58, 56];

      const startL = [2, 2, 2, 2];
      const endL = [20, 10, 5, 2];

      const duration = 3000;
      let startTime = null;

      function animate(timestamp) {
        if (!startTime) startTime = timestamp;
        const progress = Math.min((timestamp - startTime) / duration, 1);

        // Calculate current values based on progress ratio (0.0 to 1.0)
        const s = startS.map((val, i) => val + (endS[i] - val) * progress);
        const l = startL.map((val, i) => val + (endL[i] - val) * progress);

        if (consoleEl) {
          consoleEl.style.backgroundImage = `radial-gradient(
        hsl(213, ${s[0]}%, ${l[0]}%),
        hsl(213, ${s[1]}%, ${l[1]}%),
        hsl(210, ${s[2]}%, ${l[2]}%),
        hsl(207, ${s[3]}%, ${l[3]}%),
        hsl(0, 0%, 0%)
      )`;
        }

        if (progress < 1) {
          requestAnimationFrame(animate);
        }
      }

      requestAnimationFrame(animate);
      const inputBar = document.getElementById("messageInput");
      inputBar.addEventListener("keyup", () => {
        console.log("typing");
        const AIRES = document.querySelector(".chatTITLE");
        AIRES.style.transform = "scale(0)";
        setTimeout(() => {
          AIRES.style.display = "none";
        }, 5000);
      });
    </script>
    <script src="{{ url_for('static', filename='js/chat.js') }}"></script>
  </body>
</html>
